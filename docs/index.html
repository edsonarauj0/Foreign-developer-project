<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Roadmap AVP/VP & Full Stack Java Engineer - Preparação Internacional</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --badge-vp-bg: rgba(245, 158, 11, 0.15);
      --badge-vp-border: #f59e0b;
      --badge-vp-text: #fbbf24;
      --badge-core-bg: rgba(56, 189, 248, 0.15);
      --badge-core-border: #38bdf8;
      --badge-core-text: #7dd3fc;
      --badge-soft-bg: rgba(168, 85, 247, 0.15);
      --badge-soft-border: #a855f7;
      --badge-soft-text: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1rem 0.75rem 3rem 0.75rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 1.25rem;
      padding: 0 0.25rem;
    }

    h1 {
      font-size: 1.45rem;
      margin-bottom: 0.35rem;
      color: var(--accent);
      line-height: 1.25;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* Barra Superior Fixa Minimalista (Apenas progresso fino + Idiomas) */
    .sticky-mini-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.5rem 0.25rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      margin-bottom: 1rem;
    }

    .mini-bar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .lang-switcher {
      display: flex;
      gap: 0.2rem;
      background: #060b14;
      padding: 0.2rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #0b1120;
    }

    .progress-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .progress-bar-bg {
      background-color: var(--card-border);
      border-radius: 9999px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Painel de Filtros e Busca (Não Fixo, Rola junto com a tela) */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .controls-summary {
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .controls-summary::-webkit-details-marker {
      display: none;
    }

    .controls-summary::after {
      content: "▾";
      font-size: 1rem;
      color: var(--accent);
      transition: transform 0.2s;
    }

    details[open] .controls-summary::after {
      transform: rotate(180deg);
    }

    .controls-body {
      padding: 0 0.85rem 0.85rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid rgba(51, 65, 85, 0.4);
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      margin-top: 0.75rem;
    }

    .search-input {
      width: 100%;
      background: #060b14;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 0.55rem 2.2rem 0.55rem 0.75rem;
      font-size: 0.82rem;
      outline: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      display: none;
      padding: 0.2rem;
    }

    .clear-search-btn.visible {
      display: block;
    }

    .filter-buttons {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      flex-grow: 1;
      text-align: center;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
    }

    .panel-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 0.3rem;
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
    }

    /* Cartões e Listagem */
    .category-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }

    .category-header {
      margin-bottom: 0.85rem;
    }

    .category-header h2 {
      font-size: 1.05rem;
      color: var(--accent);
      line-height: 1.3;
    }

    .category-timeline {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      cursor: pointer;
    }

    .task-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      margin-top: 2px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
    }

    .task-item input[type="checkbox"]:checked {
      background-color: var(--success);
      border-color: var(--success);
    }

    .task-item input[type="checkbox"]:checked::before {
      content: "";
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.core {
      background: var(--badge-core-bg);
      border: 1px solid var(--badge-core-border);
      color: var(--badge-core-text);
    }

    .badge.vp {
      background: var(--badge-vp-bg);
      border: 1px solid var(--badge-vp-border);
      color: var(--badge-vp-text);
    }

    .badge.soft {
      background: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
    }

    .task-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .task-item.checked .task-title {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* Sessão de Anotações Mobile-Friendly */
    .notes-section {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .notes-status {
      font-size: 0.65rem;
      color: var(--success);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .notes-status.visible {
      opacity: 1;
    }

    .notes-textarea {
      width: 100%;
      min-height: 44px;
      background: #060b14;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 0.45rem;
      font-size: 0.78rem;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .no-results {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    /* Desktop adjustments */
    @media (min-width: 640px) {
      body {
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      p.subtitle {
        font-size: 0.95rem;
      }
      .filter-btn {
        flex-grow: 0;
      }
    }
  </style>
</head>

      },
      {

          es: "Fase 8: Live Coding, Inglés Técnico & Carrera Internacional",
          fr: "Phase 8: Live Coding, Anglais Technique & Carrière Internationale"
        },
        timeline: {

          en: "Week 12 • Focus: Reasoning Under Pressure, STAR Method & Canada Visa",
          es: "Semana 12 • Enfoque: Razonamiento Bajo Presión, Método STAR y Visa Canadá",
          fr: "Semaine 12 • Focus: Réflexion sous Pression, Méthode STAR et Visa Canada"
        },
        tasks: [
          {

            title: {

              en: "LeetCode Medium Algorithms (Java)",
              es: "Algoritmos LeetCode Medium (Java)",
              fr: "Algorithmes LeetCode Medium (Java)"
            },
            desc: {

              en: "Core patterns: Two Pointers, Sliding Window, Graph BFS/DFS, and high-efficiency String/HashMap processing.",
              es: "Patrones clave: Two Pointers, Sliding Window, grafos con BFS/DFS y manipulación eficiente de Strings y HashMaps.",
              fr: "Motifs essentiels: Two Pointers, Sliding Window, parcours de graphes BFS/DFS et structures HashMaps optimisées."
            },
            type: "core" 
          },
          { 
            id: "vp_talk_out_loud", 
            title: {

            },
            desc: {

              es: "Práctica continua para verbalizar decisiones técnicas, casos límite y complejidad Big-O en vivo.",
              fr: "Entraînement quotidien à verbaliser les choix techniques, cas limites et complexité Big-O en direct."

            type: "soft" 
          },
          { 
            id: "vp_star_leadership", 
            title: {

            },
            desc: {

              en: "Structuring 6 to 8 STAR stories (Situation, Task, Action, Result) highlighting technical mediation and major outage post-mortems.",
              es: "Estructuración de 6 a 8 respuestas con el método STAR demostrando liderazgo técnico y manejo de incidentes en producción.",
              fr: "Préparation de 6 à 8 récits STAR démontrant leadership technique, médiation d'architecture et gestion d'incidents critiques."
            },

          },
          { 
            id: "vp_canadian_resume", 
            title: {
              pt: "Canadian Resume Format (ATS Tailored)",
              en: "Canadian Resume Format (ATS Tailored)",
              es: "Formato de Currículum Canadiense (Adaptado a ATS)",
              fr: "CV au Format Canadien (Optimisé ATS)"
            },
            desc: {
              pt: "Remover dados pessoais irrelevantes. Descrever impactos com métricas quantificáveis (ex: TPS, latência reduzida, economia de cloud).",
              en: "Stripping discriminatory personal data. Quantifying career impact with concrete metrics (e.g., TPS, latency reduction, cost savings).",
              es: "Eliminar datos personales irrelevantes. Cuantificar logros con métricas concretas (ej: TPS, reducción de latencia, optimización en la nube).",
              fr: "Suppression des informations personnelles superflues. Quantification de l'impact avec indicateurs clés (TPS, latence réduite, coûts)."
            },
            type: "soft" 
          },
          { 
            id: "vp_wissen_outreach", 
            title: {

              en: "Direct Outreach: Wissen Calgary & Relocation",
              es: "Contacto Directo: Wissen Calgary & Relocalización",
              fr: "Approche Directe: Wissen Calgary & Relocalisation"
            },
            desc: {
              pt: "Mapeamento e contato assertivo com tomadores de decisão da Wissen Canadá e empresas com visto (LMIA / Global Skills Strategy).",
              en: "Targeting recruiters and engineering managers at Wissen Canada and tech consultancies with LMIA/Global Skills visa pipelines.",
              es: "Identificación y contacto estratégico con recruiters y líderes técnicos en Wissen Canadá y firmas que tramitan visa.",
              fr: "Ciblage et prise de contact avec les recruteurs et directeurs techniques de Wissen Canada et entreprises avec sponsorship."
            },
            type: "soft"

    ];

    const STORAGE_KEY_CHECKED = "vp_fullstack_roadmap_completed";
    const STORAGE_KEY_NOTES = "vp_fullstack_roadmap_notes";
    const STORAGE_KEY_LANG = "vp_fullstack_roadmap_lang";

    let currentLang = localStorage.getItem(STORAGE_KEY_LANG) || "pt";
    let completedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY_CHECKED)) || {};
    let taskNotes = JSON.parse(localStorage.getItem(STORAGE_KEY_NOTES)) || {};
    let currentFilter = "all";
    let currentSearchTerm = "";
    let debounceTimers = {};

    const container = document.getElementById("roadmap-tree");
    const progressFill = document.getElementById("progress-fill");
    const progressPercent = document.getElementById("progress-percent");
    const resetBtn = document.getElementById("reset-btn");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const langButtons = document.querySelectorAll(".lang-btn");

    function applyTranslations() {
      const t = i18n[currentLang];
      document.documentElement.lang = currentLang === "en" ? "en" : (currentLang === "es" ? "es" : (currentLang === "fr" ? "fr" : "pt-BR"));
      
      document.getElementById("ui-title").textContent = t.title;
      document.getElementById("ui-subtitle").textContent = t.subtitle;
      document.getElementById("ui-progress-label").textContent = t.progressLabel;
      document.getElementById("ui-filter-summary").textContent = t.filterSummary;
      document.getElementById("search-input").placeholder = t.searchPlaceholder;
      document.getElementById("btn-filter-all").textContent = t.filterAll;
      document.getElementById("btn-filter-core").textContent = t.filterCore;
      document.getElementById("btn-filter-vp").textContent = t.filterVp;
      document.getElementById("btn-filter-soft").textContent = t.filterSoft;
      document.getElementById("reset-btn").textContent = t.resetBtn;

      langButtons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });
    }

    function renderRoadmap() {
      container.innerHTML = "";
      applyTranslations();

      const t = i18n[currentLang];
      let visibleCategories = 0;
      const normalizedSearch = currentSearchTerm.trim().toLowerCase();

      roadmapData.forEach((section) => {
        const catName = section.category[currentLang] || section.category.pt;
        const timelineText = section.timeline[currentLang] || section.timeline.pt;

        const filteredTasks = section.tasks.filter((task) => {
          const taskTitle = (task.title[currentLang] || task.title.pt).toLowerCase();
          const taskDesc = (task.desc[currentLang] || task.desc.pt).toLowerCase();

          const matchesFilter = currentFilter === "all" || task.type === currentFilter;
          const matchesSearch = !normalizedSearch || 
            taskTitle.includes(normalizedSearch) || 
            taskDesc.includes(normalizedSearch) || 
            catName.toLowerCase().includes(normalizedSearch);

          return matchesFilter && matchesSearch;
        });

        if (filteredTasks.length === 0) return;

        visibleCategories++;

        const card = document.createElement("div");
        card.className = "category-card";

        const headerDiv = document.createElement("div");
        headerDiv.className = "category-header";

        const title = document.createElement("h2");
        title.textContent = catName;

        const timeline = document.createElement("div");
        timeline.className = "category-timeline";
        timeline.textContent = timelineText;

        headerDiv.appendChild(title);
        headerDiv.appendChild(timeline);
        card.appendChild(headerDiv);

        const list = document.createElement("ul");
        list.className = "task-list";

        filteredTasks.forEach((task) => {
          const item = document.createElement("li");
          item.className = `task-item ${completedTasks[task.id] ? "checked" : ""}`;

          const main = document.createElement("div");
          main.className = "task-main";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!completedTasks[task.id];
          checkbox.id = `chk_${task.id}`;

          const content = document.createElement("div");
          content.className = "task-content";

          const top = document.createElement("div");
          top.className = "task-top";

          const taskTitle = document.createElement("span");
          taskTitle.className = "task-title";
          taskTitle.textContent = task.title[currentLang] || task.title.pt;

          const badge = document.createElement("span");
          badge.className = `badge ${task.type}`;
          badge.textContent = task.type === "vp" ? t.badgeVp : (task.type === "soft" ? t.badgeSoft : t.badgeCore);

          top.appendChild(taskTitle);
          top.appendChild(badge);

          const taskDesc = document.createElement("span");
          taskDesc.className = "task-desc";
          taskDesc.textContent = task.desc[currentLang] || task.desc.pt;

          content.appendChild(top);
          content.appendChild(taskDesc);

          main.appendChild(checkbox);
          main.appendChild(content);

          main.addEventListener("click", (e) => {
            if (e.target !== checkbox) {
              checkbox.checked = !checkbox.checked;
            }
            toggleTask(task.id, checkbox.checked);
          });

          const notesSection = document.createElement("div");
          notesSection.className = "notes-section";

          const notesHeader = document.createElement("div");
          notesHeader.className = "notes-header";

          const notesLabel = document.createElement("span");
          notesLabel.textContent = t.notesLabel;

          const saveStatus = document.createElement("span");
          saveStatus.className = "notes-status";
          saveStatus.id = `status_${task.id}`;
          saveStatus.textContent = t.notesSaved;

          notesHeader.appendChild(notesLabel);
          notesHeader.appendChild(saveStatus);

          const textarea = document.createElement("textarea");
          textarea.className = "notes-textarea";
          textarea.placeholder = t.notesPlaceholder;
          textarea.value = taskNotes[task.id] || "";

          textarea.addEventListener("input", (e) => {
            saveNote(task.id, e.target.value);
          });

          notesSection.appendChild(notesHeader);
          notesSection.appendChild(textarea);

          item.appendChild(main);
          item.appendChild(notesSection);
          list.appendChild(item);
        });

        card.appendChild(list);
        container.appendChild(card);
      });

      if (visibleCategories === 0) {
        const noResults = document.createElement("div");
        noResults.className = "no-results";
        noResults.textContent = `${t.noResults} "${currentSearchTerm}".`;
        container.appendChild(noResults);
      }

      updateProgress();
    }

    function toggleTask(id, isChecked) {
      if (isChecked) {
        completedTasks[id] = true;
      } else {
        delete completedTasks[id];
      }
      localStorage.setItem(STORAGE_KEY_CHECKED, JSON.stringify(completedTasks));
      
      const chk = document.getElementById(`chk_${id}`);
      const itemEl = chk?.closest(".task-item");
      if (itemEl) {
        itemEl.classList.toggle("checked", isChecked);
      }

      updateProgress();
    }

    function saveNote(id, text) {
      const statusEl = document.getElementById(`status_${id}`);
      
      clearTimeout(debounceTimers[id]);
      debounceTimers[id] = setTimeout(() => {
        taskNotes[id] = text;
        localStorage.setItem(STORAGE_KEY_NOTES, JSON.stringify(taskNotes));
        
        if (statusEl) {
          statusEl.classList.add("visible");
          setTimeout(() => statusEl.classList.remove("visible"), 1800);
        }
      }, 500);
    }

    function updateProgress() {
      const totalTasks = roadmapData.reduce((acc, cat) => acc + cat.tasks.length, 0);
      const doneTasks = Object.keys(completedTasks).length;
      const percent = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
      const suffix = i18n[currentLang].completedSuffix;

      progressFill.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}% (${doneTasks}/${totalTasks} ${suffix})`;
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem(STORAGE_KEY_LANG, currentLang);
        renderRoadmap();
      });
    });

    searchInput.addEventListener("input", (e) => {
      currentSearchTerm = e.target.value;
      clearSearchBtn.classList.toggle("visible", currentSearchTerm.length > 0);
      renderRoadmap();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      currentSearchTerm = "";
      clearSearchBtn.classList.remove("visible");
      searchInput.focus();
      renderRoadmap();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderRoadmap();
      });
    });

    resetBtn.addEventListener("click", () => {
      const t = i18n[currentLang];
      if (confirm(t.confirmReset)) {
        completedTasks = {};
        taskNotes = {};
        localStorage.removeItem(STORAGE_KEY_CHECKED);
        localStorage.removeItem(STORAGE_KEY_NOTES);
        renderRoadmap();
      }
    });

    renderRoadmap();
  </script>
